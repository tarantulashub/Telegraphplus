<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegraph Pro - Unified</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-color: #0f172a;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #cbd5e1;
            --accent: #0088cc;
            --accent-hover: #006699;
            --shadow: 0 8px 32px 0 rgba(0, 136, 204, 0.12);
            --glass-border: 1px solid rgba(255, 255, 255, 0.6);
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #0d0f17 0%, #161925 100%);
            --card-bg: #161925;
            --text-color: #f1f2f6;
            --input-bg: #1f2233;
            --input-border: #2e334d;
            --accent: #0088cc;
            --accent-hover: #006699;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-border: 1px solid #2e334d;
        }

        body, .card, input, textarea, select, button { 
            transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        color 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            font-family: "Times New Roman", Times, serif; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 15px; 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text-color); 
            overflow-x: hidden;
        }

        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px; 
            margin-bottom: 15px; 
            border-radius: 16px; 
            box-shadow: var(--shadow); 
            border: var(--glass-border);
        }

        /* --- ANIMACIONES DE TRANSICIÓN HORIZONTAL --- */
        .slide-in-forward {
            animation: slideForward 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .slide-in-backward {
            animation: slideBackward 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideForward {
            0% {
                opacity: 0;
                transform: translateX(40px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideBackward {
            0% {
                opacity: 0;
                transform: translateX(-40px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        input, textarea, select { 
            width: 100%; 
            margin-bottom: 10px; 
            padding: 12px 15px; 
            box-sizing: border-box; 
            border: 1px solid var(--input-border); 
            border-radius: 12px; 
            font-family: "Times New Roman", Times, serif; 
            background: var(--input-bg);
            color: var(--text-color);
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(0, 136, 204, 0.25);
            outline: none;
        }

        button { 
            padding: 12px 20px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 50px; 
            margin-bottom: 8px; 
            width: 100%; 
            font-weight: bold; 
            font-family: "Times New Roman", Times, serif; 
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }

        button:hover { 
            background: var(--accent-hover); 
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.4);
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.97) translateY(0);
        }

        .btn-peligro { background: #cc0000; box-shadow: 0 4px 15px rgba(204, 0, 0, 0.3); }
        .btn-peligro:hover { background: #990000; box-shadow: 0 6px 20px rgba(204, 0, 0, 0.4); }
        .btn-exito { background: var(--accent); }
        .btn-exito:hover { background: var(--accent-hover); }
        .btn-secundario { background: #64748b; box-shadow: 0 4px 15px rgba(100, 116, 139, 0.3); }
        .btn-secundario:hover { background: #475569; box-shadow: 0 6px 20px rgba(100, 116, 139, 0.4); }

        #btnTema {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: var(--card-bg);
            border: var(--glass-border);
            box-shadow: var(--shadow);
            cursor: pointer;
        }
        #btnTema:hover {
            transform: scale(1.1);
        }

        #resultado, #infoCuenta, #listaPaginas { margin-top: 10px; font-size: 15px; }
        ul { padding-left: 0; list-style: none; }
        
        /* --- ESTILOS DE CADA ARTÍCULO (AJUSTADOS A LA REFERENCIA VISUAL) --- */
        li { 
            margin-bottom: 12px; 
            display: flex; 
            flex-direction: column; 
            background: rgba(0, 136, 204, 0.05); 
            padding: 12px; 
            border-radius: 14px; 
            border: var(--glass-border);
            gap: 10px;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .post-views {
            font-size: 13px;
            opacity: 0.85;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
        }
        .acciones-post { 
            display: flex; 
            gap: 6px; 
            justify-content: flex-end; 
        }
        .acciones-post button { 
            padding: 6px 14px; 
            width: auto; 
            font-size: 13px; 
            border-radius: 30px; 
            margin: 0; 
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #panelGestion, #menuPrincipal, #seccionAdmin, #seccionArticulos { display: none; }

        .user-badge {
            background: var(--input-bg);
            border: var(--glass-border);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: var(--shadow);
            display: inline-block;
            margin-bottom: 15px;
        }

        /* --- MODAL PARA VER TOKEN --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-content {
            background: var(--card-bg);
            border: var(--glass-border);
            box-shadow: var(--shadow);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            animation: popIn 0.3s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* BARRA DE PROGRESO DE DESCARGA */
        .progress-container {
            width: 100%;
            background-color: var(--input-border);
            border-radius: 20px;
            margin: 15px 0;
            display: none;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 12px;
            background-color: var(--accent);
            border-radius: 20px;
            transition: width 0.1s linear;
        }

        /* Loader Overlay */
        #loaderOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 15, 23, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #0088cc;
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0, 136, 204, 0.6);
        }

        .win7-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 136, 204, 0.2);
            border-top: 5px solid #0088cc;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin-bottom: 15px;
            box-shadow: 0 0 15px #0088cc;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- LOADER OVERLAY -->
    <div id="loaderOverlay">
        <div class="win7-spinner"></div>
        <span id="loaderText">Procesando solicitud...</span>
    </div>

    <!-- MODAL DE VISUALIZACIÓN DE TOKEN -->
    <div id="modalToken" class="modal-overlay">
        <div class="modal-content">
            <h3>🔑 Tu Access Token</h3>
            <p style="font-size: 13px; opacity: 0.8; margin-bottom: 10px;">Mantén este token en un lugar seguro.</p>
            
            <input type="text" id="modalTokenInput" readonly style="text-align: center; font-weight: bold; font-size: 14px;">

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <span id="progressText" style="font-size: 13px; font-weight: bold; display: none;">0%</span>

            <button class="btn-exito" onclick="copiarTokenModal()">📋 Copiar Token al Portapapeles</button>
            <button class="btn-secundario" onclick="exportarTokenConProgreso()">📥 Descargar Token en .txt</button>
            <button class="btn-peligro" style="margin-top: 10px;" onclick="cerrarModalToken()">Cerrar</button>
        </div>
    </div>

    <div class="top-bar">
        <h2>Telegraph Pro</h2>
        <button id="btnTema" onclick="toggleTema()" title="Cambiar Tema">🌙</button>
    </div>

    <!-- PANEL 1: LOGIN ON DEVICE -->
    <div id="panelLogin" class="card">
        <h3>1. Iniciar Sesión en el Dispositivo</h3>
        <label>Introduce o pega tu Access Token:</label>
        <input type="text" id="tokenInput" placeholder="Pega tu token aquí">
        
        <button class="btn-exito" onclick="loginEnDispositivo()">Iniciar Sesión y Vincular</button>

        <label style="margin-top: 10px; display: block; font-size: 14px;">O carga tu respaldo en TXT (inicia sesión automático):</label>
        <input type="file" id="archivoTxt" accept=".txt" onchange="cargarTokenDesdeTXT(event)" style="margin-bottom: 5px;">

        <div style="margin-top: 15px; border-top: 1px solid var(--input-border); padding-top: 15px;">
            <label style="font-size: 14px; font-weight: bold;">Crear Cuenta Nueva (API):</label>
            <input type="text" id="nombreCuentaNueva" placeholder="Nombre del dueño de la cuenta">
            <button class="btn-exito" onclick="crearCuentaNueva()">Crear y Registrar Cuenta Nueva</button>
        </div>
    </div>

    <!-- PANEL 2: GESTIÓN PRINCIPAL -->
    <div id="panelGestion">
        
        <div style="text-align: center;">
            <div id="infoCuentaLogueada" class="user-badge">¡Hola de nuevo!</div>
        </div>

        <!-- MENÚ DE OPCIONES -->
        <div id="menuPrincipal" class="card">
            <h3>¿Qué deseas hacer?</h3>
            <button class="btn-exito" style="padding: 15px; font-size: 16px; margin-bottom: 10px;" onclick="mostrarSeccion('admin', 'forward')">🎛️ Administrar mi cuenta</button>
            <button onclick="mostrarSeccion('articulos', 'forward')" style="padding: 15px; font-size: 16px;">📝 Crear / Gestionar mis artículos</button>
        </div>

        <!-- SECCIÓN 1: ADMINISTRAR MI CUENTA -->
        <div id="seccionAdmin" class="card">
            <h3>⚙️ Configuración de la Cuenta de Administrador</h3>
            
            <label style="font-size: 14px; font-weight: bold;">Seguridad del Access Token:</label>
            <button class="btn-secundario" style="margin-bottom: 15px;" onclick="abrirModalToken()">👁️ Ver mi token</button>

            <label style="font-size: 14px; font-weight: bold;">Nombre corto de la cuenta (Administrador):</label>
            <input type="text" id="adminShortName" placeholder="Nombre de la cuenta">

            <button class="btn-exito" onclick="actualizarCuenta()">Guardar Cambios de Cuenta</button>
            <button class="btn-peligro" style="margin-top: 10px;" onclick="revocarToken()">🔄 Revocar y Generar Nuevo Token</button>

            <button class="btn-secundario" style="margin-top: 15px;" onclick="mostrarSeccion('menu', 'backward')">⬅️ Volver al Menú</button>
            
            <hr style="border: 0; border-top: 1px solid var(--input-border); margin: 15px 0;">
            <button class="btn-peligro" onclick="cerrarSesion()">🚪 Cerrar Sesión en este Dispositivo</button>
        </div>

        <!-- SECCIÓN 2: CREAR / GESTIONAR ARTÍCULOS -->
        <div id="seccionArticulos">
            <div style="margin-bottom: 10px;">
                <button class="btn-secundario" style="width: auto;" onclick="mostrarSeccion('menu', 'backward')">⬅️ Volver al Menú Principal</button>
            </div>

            <!-- LISTAR POSTS -->
            <div class="card">
                <h3>2. Mis Artículos Publicados</h3>
                <button onclick="listarPaginas()">Cargar Lista de Posts</button>
                <div id="listaPaginas"></div>
            </div>

            <!-- EDITOR REAL -->
            <div class="card">
                <h3>3. Redactar / Editar Artículo</h3>
                <input type="hidden" id="editPath" value="">

                <input type="text" id="titulo" placeholder="Título del artículo">
                <input type="text" id="autorNombre" placeholder="Nombre del autor">
                <input type="text" id="autorUrl" placeholder="Enlace del autor (URL)">

                <textarea id="contenido" rows="8" placeholder="Escribe tu contenido usando etiquetas HTML básicas (&lt;p&gt;, &lt;b&gt;, &lt;i&gt;, &lt;h3&gt;, &lt;a&gt;)..."></textarea>
                
                <button class="btn-exito" id="btnPublicar" onclick="publicarArticulo()">Publicar Artículo</button>
                <button class="btn-secundario" id="btnCancelarEdicion" onclick="limpiarEditor()" style="display:none;">Cancelar Edición</button>
                <div id="resultado"></div>
            </div>
        </div>
    </div>

    <script>
        // @ts-nocheck
        
        function toggleTema() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('telegraph_theme', isDark ? 'dark' : 'light');
            document.getElementById('btnTema').innerText = isDark ? '☀️' : '🌙';
        }

        window.onload = function() {
            if (localStorage.getItem('telegraph_theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('btnTema').innerText = '☀️';
            } else {
                document.getElementById('btnTema').innerText = '🌙';
            }

            const savedToken = localStorage.getItem('telegraph_token');
            if (savedToken) {
                verificarYEntrar(savedToken, false, false);
            }
        };

        function mostrarLoader(texto = "Procesando solicitud...") {
            document.getElementById('loaderText').innerText = texto;
            document.getElementById('loaderOverlay').style.display = 'flex';
        }

        function ocultarLoader() {
            document.getElementById('loaderOverlay').style.display = 'none';
        }

        // CONTROL DE NAVEGACIÓN Y TRANSICIONES DIRECCIONALES
        function mostrarSeccion(seccion, direccion = 'forward') {
            const elMenu = document.getElementById('menuPrincipal');
            const elAdmin = document.getElementById('seccionAdmin');
            const elArticulos = document.getElementById('seccionArticulos');

            elMenu.style.display = 'none';
            elAdmin.style.display = 'none';
            elArticulos.style.display = 'none';

            let objetivo = null;

            if (seccion === 'menu') objetivo = elMenu;
            else if (seccion === 'admin') objetivo = elAdmin;
            else if (seccion === 'articulos') {
                objetivo = elArticulos;
                listarPaginas();
            }

            if (objetivo) {
                objetivo.style.display = 'block';
                objetivo.classList.remove('slide-in-forward', 'slide-in-backward');
                objetivo.offsetHeight; // Force Reflow
                objetivo.classList.add(direccion === 'forward' ? 'slide-in-forward' : 'slide-in-backward');
            }
        }

        /* --- MANEJO DEL MODAL Y PORTAPAPELES UNIVERSAL --- */
        function abrirModalToken() {
            const token = localStorage.getItem('telegraph_token') || '';
            document.getElementById('modalTokenInput').value = token;
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('progressText').style.display = 'none';
            document.getElementById('modalToken').style.display = 'flex';
        }

        function cerrarModalToken() {
            document.getElementById('modalToken').style.display = 'none';
        }

        // Método universal para copiar al portapapeles (compatible con file:// y Android)
        function copiarTokenModal() {
            const tokenInput = document.getElementById('modalTokenInput');
            tokenInput.select();
            tokenInput.setSelectionRange(0, 99999); // Mobile
            try {
                document.execCommand('copy');
                alert('¡Token copiado al portapapeles exitosamente!');
            } catch (err) {
                alert('No se pudo copiar de forma automática. Selecciona el texto manualmente.');
            }
        }

        function exportarTokenConProgreso() {
            const token = localStorage.getItem('telegraph_token');
            if (!token) return alert('No hay token disponible para exportar.');

            const pContainer = document.getElementById('progressContainer');
            const pBar = document.getElementById('progressBar');
            const pText = document.getElementById('progressText');

            pContainer.style.display = 'block';
            pText.style.display = 'block';
            pBar.style.width = '0%';
            pText.innerText = '0%';

            let progreso = 0;
            const intervalo = setInterval(() => {
                progreso += 10;
                pBar.style.width = progreso + '%';
                pText.innerText = progreso + '%';

                if (progreso >= 100) {
                    clearInterval(intervalo);
                    setTimeout(() => {
                        const blob = new Blob([token], { type: 'text/plain;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'telegraph_token.txt';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        alert('¡Descargado exitosamente en su dispositivo!');
                    }, 200);
                }
            }, 50);
        }

        async function verificarYEntrar(token, mostrarAlerta = true, abrirNavegador = false) {
            if (mostrarAlerta) mostrarLoader("Iniciando sesión y vinculando...");
            try {
                const response = await fetch(`https://api.telegra.ph/getAccountInfo?access_token=${token}&fields=["short_name","auth_url"]`);
                const data = await response.json();
                
                if (mostrarAlerta) ocultarLoader();

                if (data.ok) {
                    localStorage.setItem('telegraph_token', token);
                    if(data.result.auth_url) {
                        localStorage.setItem('telegraph_auth_url', data.result.auth_url);
                        if (abrirNavegador) {
                            window.open(data.result.auth_url, '_blank');
                        }
                    }
                    document.getElementById('panelLogin').style.display = 'none';
                    document.getElementById('panelGestion').style.display = 'block';
                    document.getElementById('infoCuentaLogueada').innerText = `Hola de nuevo, ${data.result.short_name}`;
                    document.getElementById('adminShortName').value = data.result.short_name || '';

                    mostrarSeccion('menu', 'forward');
                    if (mostrarAlerta) alert('¡Sesión iniciada y navegador vinculado correctamente!');
                } else {
                    if (mostrarAlerta) alert('Error de la API: ' + (data.error || 'Token no válido.'));
                    localStorage.removeItem('telegraph_token');
                }
            } catch (error) {
                if (mostrarAlerta) {
                    ocultarLoader();
                    alert('Error de red al verificar el token: ' + error);
                }
            }
        }

        async function actualizarCuenta() {
            mostrarLoader("Actualizando cuenta...");
            const token = localStorage.getItem('telegraph_token');
            const shortName = document.getElementById('adminShortName').value.trim();

            if (!shortName) {
                ocultarLoader();
                alert('El nombre corto de la cuenta es obligatorio.');
                return;
            }

            try {
                const params = new URLSearchParams();
                params.append('access_token', token);
                params.append('short_name', shortName);

                const response = await fetch('https://api.telegra.ph/editAccountInfo', {
                    method: 'POST',
                    body: params
                });
                const data = await response.json();
                ocultarLoader();

                if (data.ok) {
                    document.getElementById('infoCuentaLogueada').innerText = `Hola de nuevo, ${data.result.short_name}`;
                    alert('¡Información de la cuenta actualizada exitosamente!');
                } else {
                    alert('Error al actualizar: ' + data.error);
                }
            } catch (error) {
                ocultarLoader();
                alert('Error de red al actualizar la cuenta: ' + error);
            }
        }

        async function revocarToken() {
            if (!confirm("¿Estás seguro de revocar este token? El token actual dejará de funcionar inmediatamente y se generará uno nuevo.")) return;
            
            mostrarLoader("Revocando y generando nuevo token...");
            const token = localStorage.getItem('telegraph_token');

            try {
                const response = await fetch(`https://api.telegra.ph/revokeAccessToken?access_token=${token}`);
                const data = await response.json();
                ocultarLoader();

                if (data.ok) {
                    const nuevoToken = data.result.access_token;
                    localStorage.setItem('telegraph_token', nuevoToken);
                    alert('¡Token revocado y regenerado con éxito! Se ha actualizado tu sesión.');
                    abrirModalToken();
                } else {
                    alert('Error al revocar el token: ' + data.error);
                }
            } catch (error) {
                ocultarLoader();
                alert('Error de red al revocar el token: ' + error);
            }
        }

        function loginEnDispositivo() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) return alert('El campo de token está vacío.');
            verificarYEntrar(token, true, true);
        }

        function cerrarSesion() {
            if (!confirm("¿Deseas cerrar sesión en este dispositivo?")) return;
            localStorage.removeItem('telegraph_token');
            localStorage.removeItem('telegraph_auth_url');
            location.reload();
        }

        function cargarTokenDesdeTXT(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;
            const lector = new FileReader();
            lector.onload = function(e) {
                const contenido = e.target.result.trim();
                document.getElementById('tokenInput').value = contenido;
                verificarYEntrar(contenido, true, true);
            };
            lector.readAsText(archivo);
        }

        async function crearCuentaNueva() {
            const nombreDueño = document.getElementById('nombreCuentaNueva').value.trim();
            if (!nombreDueño) {
                alert('Por favor, introduce el nombre del dueño para la cuenta.');
                return;
            }
            mostrarLoader("Creando cuenta nueva...");
            try {
                const response = await fetch(`https://api.telegra.ph/createAccount?short_name=${encodeURIComponent(nombreDueño)}`);
                const data = await response.json();
                
                ocultarLoader();

                if (data.ok) {
                    const token = data.result.access_token;
                    document.getElementById('tokenInput').value = token;
                    verificarYEntrar(token, true, true);
                } else {
                    alert('Error al crear cuenta: ' + data.error);
                }
            } catch (error) {
                ocultarLoader();
                alert('Error de red al crear cuenta: ' + error);
            }
        }

        async function listarPaginas() {
            const token = localStorage.getItem('telegraph_token');
            if (!token) return;
            const contenedor = document.getElementById('listaPaginas');
            contenedor.innerHTML = 'Cargando artículos...';

            try {
                const response = await fetch(`https://api.telegra.ph/getPageList?access_token=${token}&limit=50`);
                const data = await response.json();
                if (data.ok) {
                    if (data.result.total_count === 0) {
                        contenedor.innerHTML = 'No tienes artículos publicados todavía.';
                        return;
                    }
                    let html = `<ul>`;
                    data.result.pages.forEach(page => {
                        html += `<li>
                            <div class="post-header">
                                <a href="${page.url}" target="_blank" style="color: var(--accent); font-weight: bold; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">${page.title}</a> 
                                <span class="post-views">👁️ ${page.views} vistas</span>
                            </div>
                            <div class="acciones-post">
                                <button class="btn-secundario" onclick="window.open('${page.url}', '_blank')">👁️ Ver</button>
                                <button class="btn-exito" onclick="cargarParaEditar('${page.path}')">✏️ Editar</button>
                                <button class="btn-peligro" onclick="eliminarArticulo('${page.path}')">🗑️ Eliminar</button>
                            </div>
                        </li>`;
                    });
                    html += `</ul>`;
                    contenedor.innerHTML = html;
                } else {
                    contenedor.innerText = 'Error al cargar páginas: ' + data.error;
                }
            } catch (error) {
                contenedor.innerText = 'Error de red: ' + error;
            }
        }

        async function eliminarArticulo(path) {
            if (!confirm("¿Estás seguro de que deseas eliminar este artículo?")) return;
            
            mostrarLoader("Eliminando artículo...");
            const token = localStorage.getItem('telegraph_token');

            try {
                const params = new URLSearchParams();
                params.append('access_token', token);
                params.append('title', 'Artículo Eliminado');
                params.append('content', JSON.stringify([{ tag: 'p', children: ['Este artículo ha sido eliminado.'] }]));
                params.append('return_content', 'true');

                const response = await fetch(`https://api.telegra.ph/editPage/${path}`, {
                    method: 'POST',
                    body: params
                });
                const data = await response.json();
                ocultarLoader();

                if (data.ok) {
                    alert('¡Artículo marcado como eliminado exitosamente!');
                    listarPaginas();
                } else {
                    alert('Error al eliminar el artículo: ' + data.error);
                }
            } catch (error) {
                ocultarLoader();
                alert('Error de red al eliminar el artículo: ' + error);
            }
        }

        function nodesToHtml(nodes) {
            if (!nodes) return '';
            let html = '';
            nodes.forEach(node => {
                if (typeof node === 'string') {
                    html += node;
                } else if (node.tag) {
                    let attrs = '';
                    if (node.attrs) {
                        for (let key in node.attrs) {
                            attrs += ` ${key}="${node.attrs[key]}"`;
                        }
                    }
                    let inner = nodesToHtml(node.children);
                    html += `<${node.tag}${attrs}>${inner}</${node.tag}>`;
                }
            });
            return html;
        }

        function htmlToNodes(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(`<div>${htmlString}</div>`, 'text/html');
            
            function parseDomNode(domNode) {
                if (domNode.nodeType === Node.TEXT_NODE) return domNode.data;
                if (domNode.nodeType !== Node.ELEMENT_NODE) return null;
                let nodeElement = { tag: domNode.tagName.toLowerCase() };
                
                if (domNode.hasAttributes()) {
                    nodeElement.attrs = {};
                    for (let attr of domNode.attributes) {
                        if (attr.name === 'href' || attr.name === 'src') {
                            nodeElement.attrs[attr.name] = attr.value;
                        }
                    }
                }
                
                if (domNode.childNodes.length > 0) {
                    nodeElement.children = [];
                    for (let child of domNode.childNodes) {
                        let parsed = parseDomNode(child);
                        if (parsed !== null) nodeElement.children.push(parsed);
                    }
                }
                return nodeElement;
            }

            let resultNodes = [];
            for (let child of doc.body.firstChild.childNodes) {
                let parsed = parseDomNode(child);
                if (parsed !== null) resultNodes.push(parsed);
            }
            return resultNodes;
        }

        async function cargarParaEditar(path) {
            try {
                const response = await fetch(`https://api.telegra.ph/getPage/${path}?return_content=true`);
                const data = await response.json();
                if (data.ok) {
                    const post = data.result;
                    document.getElementById('titulo').value = post.title;
                    document.getElementById('autorNombre').value = post.author_name || '';
                    document.getElementById('autorUrl').value = post.author_url || '';
                    document.getElementById('editPath').value = post.path;
                    document.getElementById('contenido').value = nodesToHtml(post.content);
                    
                    document.getElementById('btnCancelarEdicion').style.display = 'block';
                    document.getElementById('btnPublicar').innerText = "Guardar Cambios (Actualizar)";
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                } else {
                    alert('No se pudo cargar el post para editar.');
                }
            } catch (err) {
                alert('Error al conectar con la API: ' + err);
            }
        }

        function limpiarEditor() {
            document.getElementById('titulo').value = '';
            document.getElementById('autorNombre').value = '';
            document.getElementById('autorUrl').value = '';
            document.getElementById('contenido').value = '';
            document.getElementById('editPath').value = '';
            document.getElementById('btnCancelarEdicion').style.display = 'none';
            document.getElementById('btnPublicar').innerText = "Publicar Artículo";
        }

        async function publicarArticulo() {
            const token = localStorage.getItem('telegraph_token');
            const titulo = document.getElementById('titulo').value.trim();
            const autorNombre = document.getElementById('autorNombre').value.trim();
            const autorUrl = document.getElementById('autorUrl').value.trim();
            const textoHtml = document.getElementById('contenido').value.trim();
            const pathEditando = document.getElementById('editPath').value.trim();

            if (!token || !titulo || !textoHtml) {
                alert('Faltan datos obligatorios: Título y Contenido.');
                return;
            }

            let nodesArray = htmlToNodes(textoHtml);
            const contentNodes = JSON.stringify(nodesArray);

            const params = new URLSearchParams();
            params.append('access_token', token);
            params.append('title', titulo);
            if (autorNombre) params.append('author_name', autorNombre);
            if (autorUrl) params.append('author_url', autorUrl);
            params.append('content', contentNodes);
            params.append('return_content', 'true');

            let urlApi = 'https://api.telegra.ph/createPage';
            if (pathEditando) {
                urlApi = `https://api.telegra.ph/editPage/${pathEditando}`;
            }

            try {
                const response = await fetch(urlApi, {
                    method: 'POST',
                    body: params
                });
                const data = await response.json();

                if (data.ok) {
                    document.getElementById('resultado').innerHTML = `¡Operación exitosa! <br><a href="${data.result.url}" target="_blank" style="color: var(--accent); font-weight: bold;">Ver Artículo</a>`;
                    limpiarEditor();
                    listarPaginas(); 
                } else {
                    document.getElementById('resultado').innerText = 'Error: ' + data.error;
                }
            } catch (error) {
                document.getElementById('resultado').innerText = 'Error de red: ' + error;
            }
        }
    </script>
</body>
